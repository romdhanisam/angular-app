<mat-card class="sld-card">
    <mat-card-header>
        <div mat-card-avatar class="sld-card-header-image"></div>
        <mat-card-title>NAD</mat-card-title>
        <mat-card-subtitle>Network Area Diagram</mat-card-subtitle>
        <span class="spacer"></span>
        <a *ngIf="showVersion" mat-button matIconSuffix color="primary" target="_blank"
           [href]="'https://github.com/powsybl/powsybl-network-viewer/releases/tag/'+'v'+coreVersion" >
            <img [ngSrc]="'https://www.svgrepo.com/show/333546/github.svg'" width="20" alt="Github link" height="20"/>
            {{"v"+coreVersion}}
        </a>
    </mat-card-header>
    <mat-card-content>
        <div #host class="nad-host"></div>
        <mat-spinner *ngIf="!svgContent|| svgContent == '' || !metadata"></mat-spinner>
    </mat-card-content>
    <mat-card-actions/>
</mat-card>
